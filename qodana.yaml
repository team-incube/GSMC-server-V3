version: "1.0"
profile:
  name: qodana.recommended
include:
  - name: KotlinUnusedImport
  - name: RedundantVisibilityModifier
  - name: RedundantUnitReturnType
  - name: MemberVisibilityCanBePrivate
  - name: unused
exclude:
  - name: TODOComment
  - name: FunctionName
    paths:
      - src/test/kotlin
  - name: All
    paths:
      - .gradle
      - build
      - out
      - .qodana
      - .idea
projectJDK: "25"
linter: jetbrains/qodana-jvm:2025.2
